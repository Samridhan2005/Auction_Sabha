<!DOCTYPE html>
<html>
<head>
    <title>E-Auction</title>
 
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
 
    <!-- Your CSS -->
    <link rel="stylesheet" href="Navbar.css">
</head>
 
<body>
 
<nav class="navbar navbar-expand-lg">
  <div class="container">
 
    <!-- LEFT SIDE (Logo) -->
      <a class="navbar-brand d-flex align-items-center" href="#">
          <img src="images/logo.png" height="100" style="margin-right:0;">
      </a>
 
    <!-- Toggle -->
    <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      ☰
    </button>
 
    <!-- Menu -->
    <div class="collapse navbar-collapse" id="navbarNav">
 
      <!-- CENTER MENU -->
      <ul class="navbar-nav mx-auto">
        <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Auctions</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Sell Item</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Product Verifier</a></li>
      </ul>
 
      <!-- RIGHT SIDE -->
      <div class="d-flex gap-2">
        <button class="btn btn-outline-light">Login</button>
        <button class="btn btn-custom">Register</button>
      </div>
 
    </div>
  </div>
</nav>
<!-- HERO SECTION -->
<section class="hero position-relative vh-100">
 
    <!-- Overlay -->
    <div class="overlay position-absolute top-0 start-0 w-100 h-100"></div>
 
    <!-- Content -->
    <div class="container position-relative h-100 d-flex align-items-center">
        <div class="text-white">
 
            <span class="badge bg-secondary mb-3 p-2">
                ✨ Premier Auction Platform
            </span>
 
            <h1 class="display-4 fw-bold">
                Discover Rare Treasures <br>
                Through <span class="highlight">Live Auctions</span>
            </h1>
 
            <p class="lead mt-3">
                Join the world's most exclusive marketplace for luxury items,
                antiques, and collectibles.
            </p>
 
            <div class="mt-4">
                <button class="btn btn-warning me-3 px-4 py-2">
                    Participate →
                </button>
 
                <button class="btn btn-outline-light px-4 py-2">
                    Sell Item
                </button>
            </div>
 
        </div>
    </div>
 
</section>
 

 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

</html>
