<div class="settings-card p-4 rounded-4 shadow-sm border bg-white">
  <h3 class="fw-black mb-1">Security Settings</h3>
  <p class="text-muted small mb-4">Update your password to keep your account secure.</p>

  <form [formGroup]="changeForm" (ngSubmit)="onUpdate()">
    <div class="mb-3">
      <label class="form-label small fw-bold">Current Password</label>
      <input type="password" formControlName="oldPassword" class="form-control rounded-3">
    </div>

    <div class="mb-3">
      <label class="form-label small fw-bold">New Password</label>
      <input type="password" formControlName="newPassword" class="form-control rounded-3">
    </div>

    <div class="mb-4">
      <label class="form-label small fw-bold">Confirm New Password</label>
      <input type="password" formControlName="confirmPassword" class="form-control rounded-3">
      <div class="text-danger small mt-1" *ngIf="changeForm.errors?.['mismatch'] && changeForm.get('confirmPassword')?.touched">
        Passwords do not match.
      </div>
    </div>

    <button type="submit" class="btn sign-in-btn w-100 py-2" [disabled]="changeForm.invalid || isUpdating">
      {{ isUpdating ? 'Updating...' : 'Update Password' }}
    </button>
  </form>
</div>
