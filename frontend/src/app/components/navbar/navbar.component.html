<nav class="navbar navbar-expand-lg navbar-custom">
  <div class="container">
    
    <a class="navbar-brand brand-logo d-flex align-items-center gap-2" routerLink="/home">
      <div class="brand-icon-wrap">
        <i class="bi bi-hammer brand-hammer"></i>
      </div>
      <span class="brand-text">Auction Sabha</span>
    </a>

    <button class="navbar-toggler" type="button" 
            data-bs-toggle="collapse" 
            data-bs-target="#mainNav" 
            aria-controls="mainNav" 
            aria-expanded="false" 
            aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link nav-link-custom" routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
            <i class="bi bi-house-door me-1"></i>Home
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link nav-link-custom" routerLink="/products" routerLinkActive="active">
            <i class="bi bi-grid me-1"></i>Products
          </a>
        </li>

        <li class="nav-item" *ngIf="role === 'BUYER' || role === 'SELLER'">
          <a class="nav-link nav-link-custom" routerLink="/wallet" routerLinkActive="active">
            <i class="bi bi-wallet2 me-1"></i>Wallet
          </a>
        </li>

        <li class="nav-item" *ngIf="role === 'ADMIN'">
          <a class="nav-link nav-link-custom" routerLink="/admin" routerLinkActive="active">
            <i class="bi bi-shield-fill me-1"></i>Admin Panel
          </a>
        </li>

        <li class="nav-item" *ngIf="role === 'SELLER'">
          <a class="nav-link nav-link-custom" routerLink="/submit-product" routerLinkActive="active">
            <i class="bi bi-plus-circle me-1"></i>Sell Item
          </a>
        </li>

        <li class="nav-item" *ngIf="role === 'SELLER'">
          <a class="nav-link nav-link-custom" routerLink="/seller-dashboard" routerLinkActive="active">
            <i class="bi bi-bar-chart-line me-1"></i>My Dashboard
          </a>
        </li>

        <li class="nav-item" *ngIf="role === 'BUYER'">
          <a class="nav-link nav-link-custom" routerLink="/buyer-dashboard" routerLinkActive="active">
            <i class="bi bi-trophy me-1"></i>My Bids
          </a>
        </li>

        <li class="nav-item" *ngIf="role === 'VERIFIER'">
          <a class="nav-link nav-link-custom" routerLink="/verifier" routerLinkActive="active">
            <i class="bi bi-clipboard-check me-1"></i>Verify Products
          </a>
        </li>
      </ul>

      <!-- Global Search -->
      <form class="nav-search-form d-none d-lg-flex mx-3" (submit)="$event.preventDefault()">
        <div class="nav-search-wrap">
          <i class="bi bi-search nav-search-icon"></i>
          <input type="text" class="nav-search-input"
                 placeholder="Search auctions…"
                 [value]="navSearchText"
                 (input)="onNavSearch($any($event.target).value)" />
          <button *ngIf="navSearchText" type="button" class="nav-search-clear"
                  (click)="clearNavSearch()">
            <i class="bi bi-x-lg"></i>
          </button>
        </div>
      </form>

      <ul class="navbar-nav align-items-center gap-2">
        
        <!-- Role Badge (Click event removed from here) -->
        <li class="nav-item">
          <span class="role-badge" 
                [ngClass]="{
                  'role-buyer':    role === 'BUYER',
                  'role-seller':   role === 'SELLER',
                  'role-admin':    role === 'ADMIN',
                  'role-verifier': role === 'VERIFIER'
                }">
            <i class="bi me-1"
               [ngClass]="{
                 'bi-person-fill':       role === 'BUYER',
                 'bi-shop':              role === 'SELLER',
                 'bi-shield-fill':       role === 'ADMIN',
                 'bi-clipboard-check':   role === 'VERIFIER'
               }"></i>
            {{ role }}
          </span>
        </li>

        <!-- Username Chip (Click event added here) -->
        <li class="nav-item d-none d-lg-block">
          <span class="user-chip" style="cursor: pointer;" (click)="toggleProfile()">
            <i class="bi bi-person-circle me-1"></i>
            {{ userName }}
          </span>
        </li>

        <li class="nav-item">
          <button class="btn btn-outline-light btn-sm logout-btn fw-semibold" (click)="logout()">
            <i class="bi bi-box-arrow-right me-1"></i>Logout
          </button>
        </li>

      </ul>
    </div>
  </div>
</nav>

<!-- Profile Component Popup -->
<app-profile 
  *ngIf="isProfileVisible" 
  (closeRequested)="isProfileVisible = false">
</app-profile>
