<div class="profile-overlay" (click)="close()">
  <div class="profile-modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>User Profile</h3>
      <button class="close-x" (click)="close()">&times;</button>
    </div>

    <div class="modal-body" *ngIf="loading" style="text-align:center; padding: 2rem;">
      <div class="spinner-border text-primary" role="status"></div>
      <p style="margin-top: 1rem; color: #888;">Loading profile...</p>
    </div>

    <form (ngSubmit)="save()" *ngIf="!loading">
      <div class="modal-body">

        <div class="alert-success" *ngIf="successMsg">{{ successMsg }}</div>
        <div class="alert-error" *ngIf="errorMsg">{{ errorMsg }}</div>

        <div class="input-field">
          <label>Name</label>
          <input type="text" [(ngModel)]="user.name" name="name">
        </div>
        <div class="input-row">
          <div class="input-field">
            <label>Age</label>
            <input type="number" [(ngModel)]="user.age" name="age">
          </div>
          <div class="input-field">
            <label>Place</label>
            <input type="text" [(ngModel)]="user.place" name="place">
          </div>
        </div>
        <div class="input-field">
          <label>About</label>
          <textarea [(ngModel)]="user.about" name="about"></textarea>
        </div>
        <div class="input-field">
          <label>Phone</label>
          <input type="text" [(ngModel)]="user.phone" name="phone">
        </div>

      </div>
      <div class="modal-footer">
        <button type="button" class="btn-cancel" (click)="close()">Cancel</button>
        <button type="submit" class="btn-save" [disabled]="saving">
          {{ saving ? 'Saving...' : 'Update Profile' }}
        </button>
      </div>
    </form>
  </div>
</div>
